@if (showPlaceholder()) {
  <div class="cover-placeholder" aria-label="Kein Bild">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M7 3h10l-.7 7a4.3 4.3 0 0 1-3.3 4.1V19h3v2H8v-2h3v-4.9A4.3 4.3 0 0 1 7.7 10L7 3Z" />
    </svg>
  </div>
} @else {
  <img class="cover-img" [src]="src()" [alt]="wine().name" loading="lazy" (error)="onError()" />
}
