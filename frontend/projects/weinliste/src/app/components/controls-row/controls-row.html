<div class="controls-row">

  <app-sort-button />

  <div class="actions">
    <div class="more-filters">
      <button class="pill" type="button" (click)="toggleMoreFiltersMenu()">Mehr Filter ▾</button>
      @if (moreFiltersOpen()) {
        <div class="more-menu">
          @for (d of availableDescriptors(); track trackDescriptor($index, d)) {
            <label class="more-item">
              <input
                type="checkbox"
                [checked]="isFieldVisible(d.key)"
                (change)="toggleMoreFilter(d.key, $any($event.target).checked)"
              />
              {{ d.label }}
            </label>
          } @empty {
            <span class="more-empty">Keine weiteren Filter</span>
          }
        </div>
      }
    </div>

    <button
      class="pill"
      type="button"
      title="Tastenkürzel: i"
      [class.active]="fs.infoToggleActive()"
      (click)="toggleInfo()"
    >
      Infos {{ fs.infoToggleActive() ? 'an' : 'aus' }}
    </button>

    <button class="pill" type="button" title="Tastenkürzel: l" (click)="toggleList()">
      {{ fs.viewMode() === 'grid' ? 'Liste' : 'Kacheln' }}
    </button>
  </div>

  <div class="filters">
    <app-filter-field [descriptor]="searchDescriptor" class="search-input" />
    @for (d of visibleDescriptors(); track trackDescriptor($index, d)) {
      <app-filter-field [descriptor]="d" [removable]="true" (remove)="removeFilter($event)" />
    }
  </div>

</div>
